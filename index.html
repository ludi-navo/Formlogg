<style>
/* Layout: dark glass cards on a near-black field with soft light pools; white is the only accent, semantic colors carry state */
:root{
  --bg:#08080A; --card:#121215; --card2:#17171B; --card3:#1D1D22;
  --panel:#121215; --panel2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --line3:rgba(255,255,255,.2);
  --fg:#EDEDEF; --soft:#B4B4BC; --muted:#8A8A94; --dim:#5E5E68;
  --pri:#EDEDEF; --pri-dim:rgba(255,255,255,.07); --ink:#0A0A0A;
  --info:#9DB8FF; --info-dim:rgba(157,184,255,.1);
  --good:#7EE2A8; --good-dim:rgba(126,226,168,.1); --warn:#F5C76B; --bad:#F28B82; --bad-dim:rgba(242,139,130,.1);
  --r:18px; --r-s:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -24px rgba(0,0,0,.8);
  --f-display:"Sora","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;background-color:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 10% -8%,rgba(255,255,255,.07),transparent 60%),
  radial-gradient(600px 420px at 100% 0%,rgba(157,184,255,.05),transparent 60%),
  radial-gradient(800px 520px at 50% 115%,rgba(255,255,255,.035),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(108px + env(safe-area-inset-bottom,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,8,10,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:17px;color:var(--fg);display:flex;align-items:center;gap:9px}
.brand i{width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#fff 0%,#d9d9de 100%);display:inline-block;box-shadow:0 6px 16px -6px rgba(255,255,255,.5)}
.sync{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.sync.on{color:var(--soft)}
.sync.on::before{background:var(--good);box-shadow:0 0 8px var(--good)}
.datenav{display:flex;align-items:center;gap:6px;margin:12px auto 0;max-width:560px}
.datenav button.arr{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--soft);font-size:18px}
.datenav button.arr:disabled{opacity:.3}
.dlabel{flex:1;text-align:center}
.dlabel b{display:block;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.03em}
.dlabel span{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

.demo{margin-top:14px;border:1px solid var(--line2);background:var(--info-dim);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
.demo b{font-family:var(--f-mono);font-weight:500;color:var(--info);text-transform:uppercase;letter-spacing:.1em;font-size:10px;display:block}
.demo button{border:1px solid var(--line2);border-radius:10px;color:var(--fg);padding:7px 10px;font-size:12px;white-space:nowrap}

.sec{display:none;flex-direction:column;gap:12px;padding-top:16px}
.sec.on{display:flex}
.mod{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;min-width:0}
.hud{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border-color:var(--line2)}
.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl button{color:var(--soft);letter-spacing:.1em;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line2);border-radius:999px}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--fg);border-radius:var(--r-s);padding:0 16px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 24px -10px rgba(255,255,255,.45)}
.btn.ghost{border-color:var(--line);color:var(--soft);background:none}
.btn.cyan{border-color:rgba(157,184,255,.35);color:var(--info);background:var(--info-dim)}
.btn.warn{border-color:rgba(242,139,130,.35);color:var(--bad);background:var(--bad-dim)}
.btn.warn.sure{background:var(--bad);color:#1a0505}
.btn:disabled{opacity:.35}
.addrow{display:flex;gap:8px}
.inp,.addrow input{flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:var(--r-s);padding:11px 13px;font-size:16px}
.inp::placeholder,.addrow input::placeholder{color:var(--dim)}

/* day */
.dayhead{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.dayinfo{min-width:0;display:flex;flex-direction:column;gap:6px}
.dayinfo .big{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.dayinfo p{margin:0;color:var(--muted);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 0;border-radius:12px;border:1px solid transparent}
.week button.sel{border-color:var(--line2);background:rgba(255,255,255,.04)}
.week span{font-family:var(--f-mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.week i{width:100%;max-width:26px;height:26px;display:block;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.habits{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hrow2{display:flex;gap:8px;align-items:center}
.habit{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);text-align:left;width:100%;min-width:0;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.habit:active{transform:scale(.985)}
.box{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line3);display:grid;place-items:center;flex:none;transition:all .2s var(--ease)}
.box svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.habit.done{border-color:var(--line3);background:rgba(255,255,255,.06)}
.habit.done .box{background:linear-gradient(180deg,#fff,#e4e4e8);border-color:transparent;box-shadow:0 6px 16px -6px rgba(255,255,255,.55)}
.habit.done .box svg{opacity:1;transform:none}
.habit .t{flex:1;min-width:0}
.habit .t b{display:block;font-weight:600;font-size:15px}
.habit .t span{font-size:12px;color:var(--muted)}
.habit .st{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.04em;color:var(--fg);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.habit .st small{display:block;font-family:var(--f-mono);font-size:8px;color:var(--muted);letter-spacing:.14em;font-weight:400;margin-top:4px}
.del{color:var(--bad);font-size:12px;font-weight:600;border:1px solid rgba(242,139,130,.3);background:var(--bad-dim);border-radius:10px;padding:9px 10px;white-space:nowrap}
.del.sure{background:var(--bad);color:#1a0505}
.bw{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.03em;display:block}
.cta span{font-size:13px;color:var(--muted)}

.field{position:relative;min-width:0;display:block}
.field input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:var(--r-s);padding:12px 40px 12px 13px;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;transition:border-color .2s}
.field input:focus{border-color:var(--line3);outline:none;background:rgba(255,255,255,.05)}
.field input::placeholder{color:var(--dim)}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted);pointer-events:none}

/* pass home */
.start{display:flex;flex-direction:column;gap:14px}
.start h2{font-size:26px;letter-spacing:-.045em}
.bigbtn{width:100%;min-height:62px;border-radius:16px;background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(0,0,0,.08) inset,0 14px 34px -12px rgba(255,255,255,.45);transition:transform .15s var(--ease)}
.bigbtn:active{transform:scale(.98)}
.bigbtn svg{width:18px;height:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.15}
.facts span{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.prog{display:flex;flex-direction:column;margin-top:8px}
.pitem{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.pitem b{font-weight:600;display:block;min-width:0}
.pitem small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pitem .tr{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mgrid span{min-width:0;overflow-wrap:anywhere}
.mgrid button.mv{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);color:var(--soft)}
.mgrid button.mv:disabled{opacity:.25}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list button:last-child{border-bottom:0}
.list b{font-weight:600;display:block}
.list span{font-size:12px;color:var(--muted)}
.list .r{font-family:var(--f-mono);font-size:12px;color:var(--soft);text-align:right;white-space:nowrap}
.flag{border:1px solid rgba(157,184,255,.25);background:var(--info-dim);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}

.pcard{display:grid;grid-template-columns:1fr auto;grid-template-areas:"top go" "meta go";gap:6px 12px;align-items:center;text-align:left;width:100%;padding:16px 16px 15px 18px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.pcard:active{transform:scale(.985)}
.pc-top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.pc-top b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.pc-top em{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(10,10,10,.08);border:1px solid rgba(10,10,10,.15)}
.pc-meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.pc-go{grid-area:go;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.pc-go svg{width:16px;height:16px}
.pcard.next{background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -14px rgba(255,255,255,.45)}
.pcard.next .pc-meta{color:#55555e}
.pcard.next .pc-go{background:var(--ink);color:#fff;border-color:transparent}
.lastp{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.lastp .lbl{display:block;margin-bottom:3px}
.lastp b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.03em}
.lastp small{font-size:12px;color:var(--muted)}
.lastp .r{font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap}
.addrow.past{flex-wrap:wrap}
.addrow.past .inp{flex:1 1 130px}
.addrow.past .btn{flex:1 1 100%}
select.inp{appearance:none;-webkit-appearance:none;color:var(--fg)}
.hright{display:flex;align-items:center;gap:10px}
.gear{width:34px;height:34px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--soft)}
.gear svg{width:18px;height:18px}
.gear.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink);border-color:transparent}
.q{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.q>span{font-size:14px;font-weight:500}
.q small{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.q small i{font-style:normal}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sc.yn{grid-template-columns:1fr 1fr}.sc.s3{grid-template-columns:repeat(3,1fr)}
.sc button{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;font-size:14px;color:var(--soft)}
.sc button.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink);border-color:transparent}
.sorer{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.sorer em{font-style:normal;font-size:13px;color:var(--soft)}
.ci .inp{margin-top:8px}
.rdy .rdyrow{display:flex;align-items:center;gap:14px;margin-top:10px}
.rdy .rdyrow b{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.05em;line-height:1}
.rdy .rdyrow .bar{flex:1;grid-column:auto}
.rdy small{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
.sugg{border:1px solid rgba(157,184,255,.25);background:var(--info-dim);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sugg em{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--info)}
.sugg b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.03em}
.sugg small{font-size:12px;color:var(--soft)}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wgrid .field input{padding-right:46px;font-size:17px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(245,199,107,.12);color:var(--warn);border:1px solid rgba(245,199,107,.3)}
.expc{border-color:rgba(245,199,107,.3);background:linear-gradient(180deg,rgba(245,199,107,.08),rgba(245,199,107,.02))}
.expc p{margin:8px 0 4px;font-size:15px;font-weight:500}
.expc small{font-size:12px;color:var(--muted)}
.expc .lbl span:last-child{color:var(--warn)}
.seg.walk{flex:.55;background:rgba(157,184,255,.15)}
.seg.walk.done{background:var(--info);box-shadow:0 0 10px rgba(157,184,255,.4)}
.seg.skip{background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 6px)}
.rir{display:inline-flex;align-items:center;gap:4px}
.rir button{min-width:26px;height:22px;border-radius:999px;border:1px solid var(--line2);font-family:var(--f-mono);font-size:10px;color:var(--soft);padding:0 6px}
.rir button.on{background:var(--pri);color:var(--ink);border-color:transparent}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.woprev i{font-style:normal;color:var(--muted);font-size:11px}
.board{display:flex;flex-direction:column;margin-top:8px}
.board div{display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"pos name pts" "pos name tot";gap:0 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.board div:last-child{border-bottom:0}

function migrate(R){let ch=false;
  if(!Array.isArray(R.exercises))R.exercises=[];
  if(!Array.isArray(R.programs)||!R.programs.length){R.programs=DEF_PROGS();ch=true}
  const have=new Set(R.exercises.map(e=>e.id));
  R.programs.forEach(p=>{if(!Array.isArray(p.ex))p.ex=[];p.ex.forEach(id=>{if(!have.has(id)){const d=DEF_EX.find(x=>x[0]===id);R.exercises.push({id,name:d?d[1]:id});have.add(id);ch=true}})});
  if("programSet" in R){delete R.programSet;ch=true}
  ["profile","checkins","measures","goals"].forEach(k=>{if(!R[k]||typeof R[k]!=="object"){R[k]={}}});

/* ---------- demo: 12 weeks of the same program, 3 pass a week ---------- */
function buildDemo(){
  const d=DEFAULT();d.habits.splice(1,0,{id:"sleep",name:"Sovit 7 h+"});
  const base={bench:62.5,squat:80,dead:100,ohp:40,row:55,incdb:22,dips:10,pushdown:25,chins:5,facepull:20,curl:14,rdl:70,legpress:120,legcurl:35,calf:60,latraise:8,revfly:7,hlr:0,backext:10},step={};
  let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  let n=0;
  for(let i=84;i>=1;i--){
    const day=addDays(today(),-i),wd=parse(day).getDay(),list=[];
    const slept=rnd()>.3;if(slept)list.push("sleep");
    const ate=rnd()>(slept?.18:.5);if(ate)list.push("eat");
    const trains=((wd===1||wd===3||wd===5)&&rnd()>(ate?.06:.3))||(wd===6&&rnd()>.85);
    if(trains){
      n++;list.push("train");
      const start=parse(day).getTime()+(16.5+rnd()*2)*36e5;let t=start+6*6e4;const sets=[];
      const pg=d.programs[(n-1)%d.programs.length];
      progExs(d,pg).forEach(ex=>{
        const w=Math.round(((base[ex.id]||20)*(1+.0035*n))/1.25)*1.25,cnt=rnd()>.75?3:2;
        for(let k=0;k<cnt;k++){const r=Math.max(4,8-k-(rnd()>.65?1:0)-(slept?0:1));t+=(2+rnd()*1.5)*6e4;sets.push({e:ex.id,kg:w,r,n:k,t})}
        t+=2*6e4;
      });
      d.sessions[day]={prog:pg.id,walks:{pre:{min:20,inc:6,spd:5,at:start-4*6e4},post:{min:20,inc:Math.min(15,7+Math.floor(n/8)),spd:5.2,at:t+25*6e4}},start,end:t+3*6e4,feel:Math.max(1,Math.min(5,Math.round(3+(slept?.8:-.6)+(ate?.3:0)+(rnd()-.5)*1.4))),sets};
    }
    if(rnd()>.25)d.checkins[day]={energy:slept?4:2,stress:2+Math.round(rnd()*2),mood:3+Math.round(rnd()),motiv:slept?4:3,food:ate?4:2,protein:ate,alcohol:rnd()>.85,pain:false};
    if(i%3===0)d.measures[day]={waist:Math.round((86+i*.03)*10)/10,neck:38.5,hip:98,arm:36.5,chest:102,thigh:58};
    if(rnd()>.45)d.body[day]=Math.round((80.4+i*.02+(rnd()-.5)*.7)*10)/10;
    if(list.length)d.days[day]=list;
  }
  return d;
}

async function pull(){

    const {data,error}=await sb.from("formlogg").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();
    if(error)throw error;const m=meta(),sameUser=m.uid===sbUser.id;

const sessionDates=S=>Object.keys(S.sessions).filter(d=>(S.sessions[d].sets||[]).length).sort();
const exSets=(S,day,ex)=>((S.sessions[day]||{}).sets||[]).filter(x=>x.e===ex);

const dur=s=>s&&s.start&&s.end?(s.end-s.start)/6e4:null;

function exSeries(S,ex){return sessionDates(S).map(d=>{const sets=exSets(S,d,ex);if(!sets.length)return null;
  return{d,top:Math.max(...sets.map(x=>x.kg)),e1:Math.max(...sets.map(x=>e1rm(x.kg,x.r))),vol:sets.reduce((a,x)=>a+x.kg*x.r,0),reps:sets.reduce((a,x)=>a+x.r,0),sets}}).filter(Boolean)}

function refFor(S,ex,day){const lf=lastFor(S,ex,day);if(lf)return lf;const ds=sessionDates(S).filter(d=>d>day&&d!==day);for(const d of ds){const sets=exSets(S,d,ex);if(sets.length)return{d,sets:sets.slice().sort((a,b)=>(a.n||0)-(b.n||0)),after:true}}return null}
function prevSession(S,day){const ds=sessionDates(S).filter(d=>d<day);return ds.length?ds[ds.length-1]:null}
function firstOpen(S,day,exs){exs=exs||S.exercises;const i=exs.findIndex(e=>exSets(S,day,e.id).length<BASE_SETS);return i<0?Math.max(0,exs.length-1):i}
const progOf=(S,id)=>(S.programs||[]).find(p=>p.id===id)||null;
const progExs=(S,p)=>p?p.ex.map(id=>S.exercises.find(e=>e.id===id)).filter(Boolean):[];
function sessExs(S,day,pid){const p=progOf(S,pid);if(p)return progExs(S,p);const ids=[...new Set(((S.sessions[day]||{}).sets||[]).map(x=>x.e))];
  const l=ids.map(id=>S.exercises.find(e=>e.id===id)).filter(Boolean);return l.length?l:progExs(S,S.programs[0])}
function nextProg(S){const sd=sessionDates(S);for(let i=sd.length-1;i>=0;i--){const k=S.programs.findIndex(p=>p.id===S.sessions[sd[i]].prog);if(k>-1)return S.programs[(k+1)%S.programs.length]}return S.programs[0]||null}
const progSessions=(S,pid)=>sessionDates(S).filter(d=>S.sessions[d].prog===pid);
function usedEx(S){const ids=new Set();S.programs.forEach(p=>p.ex.forEach(i=>ids.add(i)));sessionDates(S).forEach(d=>S.sessions[d].sets.forEach(x=>ids.add(x.e)));return S.exercises.filter(e=>ids.has(e.id))}
const exWithData=S=>usedEx(S).filter(e=>exSeries(S,e.id).length);
function dayScore(S,day){if(!S.habits.length)return 0;const c=(S.days[day]||[]).filter(id=>S.habits.some(h=>h.id===id)).length;return c/S.habits.length}

function volRange(S,a,b){const t=today();return sessionDates(S).filter(d=>{const x=daysBetween(d,t);return x>=a&&x<b}).reduce((s,d)=>s+sessVol(S.sessions[d]),0)}

function hBase(k,day,n){const v=[];for(let i=1;i<=(n||14);i++){const x=(health.daily[addDays(day,-i)]||{})[k];if(x>0)v.push(x)}return v.length>=3?mean(v):null}
function readiness(S,day){day=day||today();const h=health.daily[day]||{},ci=(S.checkins||{})[day]||{},parts=[];
  const bh=hBase("hrv",day),br=hBase("rhr",day);
  if(h.hrv>0&&bh)parts.push(["HRV",clamp(50+(h.hrv/bh-1)*250)]);
  if(h.rhr>0&&br)parts.push(["Vilopuls",clamp(50-(h.rhr/br-1)*500)]);
  if(h.sleep>0)parts.push(["Sömn",clamp((h.sleep-5)/3*100)]);
  if(ci.energy)parts.push(["Energi",(ci.energy-1)*25]);

/* ---------- coaching: suggestions, experiments, plateaus, deload ---------- */
const deloadOn=S=>!!(S.deloadUntil&&today()<=S.deloadUntil);

  const top=Math.max(...lf.sets.map(x=>x.kg)),atTop=lf.sets.filter(x=>x.kg===top),inc=top<20?1:2.5;
  const minR=Math.min(...atTop.map(x=>x.r)),maxR=Math.max(...lf.sets.map(x=>x.r)),rirs=atTop.map(x=>x.rir).filter(v=>v!=null),easy=rirs.length&&Math.min(...rirs)>=2;

  if(rd&&rd.score<45)return{kg:top,r:Math.max(lo,minR),why:"Låg dagsform idag: håll vikten"};

  const pd=prevSession(S,day);if(pd&&S.sessions[pd].exp&&S.sessions[pd].exp.acc)return null;

  const cands=exs.filter(e=>lastFor(S,e.id,day)&&!(s.skip||{})[e.id]&&!exSets(S,day,e.id).length);if(!cands.length)return null;

  Object.keys(S.sessions).filter(d=>d>=ws&&d<=we).forEach(d=>{const w=S.sessions[d].walks||{};["pre","post"].forEach(k=>{if(w[k]){walk+=+w[k].min||0;const h=walkHR(w[k]);if(h&&h.hr>=lo&&h.hr<=hi)z2m+=+w[k].min||0}})});
  const en=[];for(let d=ws;d<=we;d=addDays(d,1)){const c=(S.checkins||{})[d];if(c&&c.energy)en.push(c.energy)}
  return{ws,we,pass:sd.length,vol:sd.reduce((a,d)=>a+sessVol(S.sessions[d]),0),pr:prEvents(S).filter(p=>p.d>=ws&&p.d<=we).length,hab:days?hab/days*100:0,walk,z2m,energy:en.length?mean(en):null}}
function points(S,from,to){const inR=d=>(!from||d>=from)&&(!to||d<=to),det={pass:0,habits:0,walk:0,checkin:0};
  det.pass=sessionDates(S).filter(inR).length;
  Object.keys(S.days).filter(inR).forEach(d=>(S.days[d]||[]).forEach(id=>{const h=S.habits.find(x=>x.id===id);if(h&&!h.auto)det.habits++}));
  Object.keys(S.sessions).filter(inR).forEach(d=>{const w=S.sessions[d].walks||{};["pre","post"].forEach(k=>{if(w[k])det.walk+=+w[k].min||0})});

/* ---------- charts ---------- */
function niceTicks(min,max,count){const span=max-min||1,raw=span/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),nr=raw/mag;
  const step=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(4));return t}
const MONO='font-family="JetBrains Mono,monospace"';
function lineChart(pts,series,o){
  o=o||{};if(pts.length<2)return `<p class="empty" style="margin-top:12px">${o.empty||"Behöver minst två mätpunkter för en kurva."}</p>`;
  const W=520,H=o.h||200,L=44,R=14,T=14,B=26,id="g"+Math.random().toString(36).slice(2,7);
  const vals=pts.flatMap(p=>series.map(s=>p[s.k])).filter(v=>v!=null);
  let mn=Math.min(...vals),mx=Math.max(...vals);const pv=(mx-mn)*.1||Math.max(1,mx*.02);
  const ticks=niceTicks(mn-pv,mx+pv,4),lo=ticks[0],hi=ticks[ticks.length-1];
  const span=Math.max(1,daysBetween(pts[0].d,pts[pts.length-1].d));
  const x=d=>L+(W-L-R)*daysBetween(pts[0].d,d)/span,y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
  const path=k=>pts.map((p,i)=>(i?"L":"M")+x(p.d).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");
  let g="";ticks.forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)"/><text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--dim)" font-size="11" ${MONO}>${fmt(t,1)}</text>`});
  let s="";const last=pts[pts.length-1];
  series.forEach(se=>{
    if(se.area)s+=`<path d="${path(se.k)} L${x(last.d).toFixed(1)} ${H-B} L${x(pts[0].d).toFixed(1)} ${H-B} Z" fill="url(#${id})"/>`;
    s+=`<path d="${path(se.k)}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if(se.dots)s+=pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p[se.k]).toFixed(1)}" r="2.2" fill="${se.color}"/>`).join("");
  });
  const m=series[0];
  s+=`<circle cx="${x(last.d).toFixed(1)}" cy="${y(last[m.k]).toFixed(1)}" r="5" fill="var(--bg)" stroke="${m.color}" stroke-width="2"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Diagram")}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
    ${g}${s}<text x="${L}" y="${H-6}" fill="var(--dim)" font-size="11" ${MONO}>${shortDate(pts[0].d)}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end" fill="var(--dim)" font-size="11" ${MONO}>${shortDate(last.d)}</text></svg>`;
}
function barChart(vals,labels,top,hiIdx){
  const W=520,H=170,L=8,R=8,T=22,B=24,n=vals.length,max=Math.max(...vals,1),gap=6,bw=(W-L-R-gap*(n-1))/n;
  let s="";vals.forEach((v,i)=>{const h=(H-T-B)*(v/max),x=L+i*(bw+gap),y=H-B-h,on=i===hiIdx;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,v?2:1).toFixed(1)}" fill="${on?"var(--pri)":"var(--soft)"}" opacity="${on?1:.32}" rx="4"/>`;
    if(labels[i])s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" fill="var(--dim)" font-size="10" ${MONO}>${labels[i]}</text>`;
    if(on&&v)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" fill="var(--pri)" font-size="11" ${MONO}>${top(v)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line2)"/>${s}</svg>`;
}

function defaultDraft(day,ex,k){

    if(x&&x.acc&&x.ex===ex){if(x.type==="lighter"){kg=roundKg(sg.kg*.9);r=sg.r+3}if(x.type==="heavier"){kg=roundKg(sg.kg*1.05);r=Math.max(2,sg.r-2)}}

}

function renderExStep(S,day,s,ex){

function sessionCompare(S,day){
  const s=S.sessions[day],pd=prevSession(S,day),ps=pd?S.sessions[pd]:null;

    const before=lf?Math.max(...lf.sets.map(x=>e1rm(x.kg,x.r))):null,pb=bestBefore(S,id,day);

}

function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast("Kopierat."),()=>toast("Kunde inte kopiera. Markera texten och kopiera själv."))}catch(e){toast("Kunde inte kopiera. Markera texten och kopiera själv.")}}
function renderWatchSettings(){
  if(store.mode!=="supa")return `<div class="mod"><div class="lbl"><span>Apple Watch</span></div><p class="note" style="margin-top:8px">Fungerar i appen på hemskärmen när du är inloggad.</p></div>`;
  if(!sbUser)return `<div class="mod"><div class="lbl"><span>Apple Watch</span></div><p class="note" style="margin-top:8px">Logga in först, så kopplas klockan till ditt konto.</p></div>`;
  ensureToken();const last=health.lastAt?new Date(health.lastAt):null;
  return `<div class="mod"><div class="lbl"><span>Apple Watch</span><span class="${last&&Date.now()-last<864e5?"up":"flat"}">${last?"Senast "+last.toLocaleString("sv-SE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Ingen data än"}</span></div>
    <p class="note" style="margin-top:8px">Klockan skickar data via en genväg i appen Genvägar. Genvägen behöver de här tre sakerna:</p>
    <div class="copyrow"><span>Adress</span><code>${esc(INGEST())}</code><button class="btn ghost" data-copy="url">Kopiera</button></div>
    <div class="copyrow"><span>Nyckel</span><code>${esc(SUPA.key)}</code><button class="btn ghost" data-copy="key">Kopiera</button></div>
    <div class="copyrow"><span>Din kod</span><code>${health.token?esc(health.token):"Hämtar…"}</code><button class="btn ghost" data-copy="token" ${health.token?"":"disabled"}>Kopiera</button></div>
    <p class="note" style="margin-top:8px">Koden är personlig och kopplar datan till just ditt konto. Dela den inte.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><a class="btn" href="${SHORTCUT_URL}">Hämta från klockan</a><button class="btn ghost" id="guideT">${guideOpen?"Dölj guide":"Visa guide"}</button></div>
    ${guideOpen?guideHtml():""}</div>`}
function renderBackup(){let h=`<div class="mod"><div class="lbl"><span>Säkerhetskopia</span><button id="bkToggle">${backupOpen?"Stäng":"Öppna"}</button></div>`;
  if(backupOpen){h+=`<p class="note" style="margin-top:8px">Kopiera texten och spara den någonstans, t.ex. i Anteckningar. Klistra in den här för att flytta din logg till en annan enhet.</p>
    <textarea id="bkOut" readonly style="margin-top:10px">${esc(JSON.stringify(real))}</textarea>
    <button class="btn cyan" id="bkCopy" style="margin-top:8px;width:100%">Kopiera</button>
    <textarea id="bkIn" placeholder="Klistra in en säkerhetskopia här" style="margin-top:14px"></textarea>
    <button class="btn warn ${confirmDel==="import"?"sure":""}" id="bkImport" style="margin-top:8px;width:100%">${confirmDel==="import"?"Ersätter all din data. Tryck igen":"Läs in och ersätt min data"}</button>`}
  return h+`</div>`}
function renderSettings(){const S=real,p=prof(S),[lo,hi]=z2(S),seg=(k,opts)=>`<div class="seg3 big">${opts.map(([v,l])=>`<button class="${p[k]===v?"on":""}" data-pf="${k}|${v}">${l}</button>`).join("")}</div>`;
  let h=`<div class="mod hud"><div class="lbl"><span>Profil</span><span>Styr förslagen</span></div><div class="form">
    <label>Namn i topplistan<input class="inp" id="pfName" maxlength="30" value="${esc(p.name)}" placeholder="Ditt namn"></label>
    <label>Kön${seg("sex",[["m","Man"],["f","Kvinna"]])}</label>
    <div class="two"><label>Längd (cm)<input class="inp" id="pfHeight" inputmode="numeric" value="${esc(p.height)}" placeholder="180"></label><label>Födelseår<input class="inp" id="pfBirth" inputmode="numeric" value="${esc(p.birth)}" placeholder="1998"></label></div>
    <label>Träningsmål${seg("goal",[["styrka","Styrka"],["muskler","Muskelmassa"],["båda","Båda"]])}</label>
    <label>Gången är främst för${seg("walkGoal",[["fett","Fettförbränning"],["kondition","Kondition"],["uppvärmning","Uppvärmning"]])}</label>
    <label class="tog"><span>Visa mig i topplistan</span><button class="switch ${p.board?"on":""}" data-pf="board|${p.board?"0":"1"}" aria-pressed="${p.board}" aria-label="Visa mig i topplistan"><i></i></button></label></div>
    <button class="btn solid" id="pfSave" style="width:100%;margin-top:14px">Spara profil</button>
    <p class="note" style="margin-top:10px">Förslagen siktar på ${repRange(S).join("–")} reps. Maxpuls cirka ${maxHR(S)}, zon 2 är ${lo}–${hi} slag per minut.</p></div>`;
  return renderAccount()+h+renderWatchSettings()+renderBackup()}
function render(){
  if(authMode){$("#datenav").hidden=true;$("#demoBox").innerHTML="";document.querySelector("nav").hidden=true;
    document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-day"));$("#s-day").innerHTML=renderAuth();return}
  document.querySelector("nav").hidden=false;
  renderHeader();$("#gear").classList.toggle("on",tab==="settings");
  document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("on",s.id==="s-"+tab));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  if(tab==="day")renderDay();else if(tab==="gym")renderGym();else if(tab==="settings")$("#s-settings").innerHTML=renderSettings();else if(tab==="board")$("#s-board").innerHTML=renderBoard();else renderStats();
}

/* ---------- events ---------- */
const resetDrafts=()=>{for(const k in drafts)delete drafts[k]};
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const D=b.dataset;
  if(D.tab){if(D.tab===tab&&tab==="gym"){detailDay=null}tab=D.tab;confirmDel=null;skipPick=null;render();window.scrollTo({top:0});if(tab==="board"){loadBoard(true);boardSync()}return}
  if(b.id==="prevDay"){sel=addDays(sel,-1);confirmDel=null;render();return}
  if(b.id==="nextDay"){if(sel<today()){sel=addDays(sel,1);render()}return}
  if(b.id==="exitDemo"){demoOn=false;demoDismissed=true;if(cfgMissing)saveConfig();render();return}
  if(D.go){sel=D.go;render();return}
  if(D.habit){toggleHabit(D.habit);return}
  if(b.id==="editH"){editHabits=!editHabits;confirmDel=null;render();return}
  if(b.id==="addH"){addHabit();return}
  if(D.delh){delHabit(D.delh);return}
  if(b.id==="bwSave"){saveBody();return}
  if(D.start!==undefined){if(b.dataset.empty){viewProg=D.start;manageEx=true;render();toast("Lägg till övningar i passet först.");return}startWorkout(today(),D.start);return}
  if(D.resume){const s=real.sessions[today()]||{};wo={day:today(),prog:s.prog,idx:firstOpenStep(real,today(),s.prog)};tab="gym";render();window.scrollTo({top:0});return}
  if(D.vp){viewProg=D.vp;confirmDel=null;render();return}
  if(b.id==="addProg"||b.id==="addProg2"){addProg();return}
  if(b.id==="renProg"){renameProg();return}
  if(b.id==="delProg"){delProg();return}
  if(D.wset){const[ex,k]=D.wset.split("|");woSet(ex,+k);return}
  if(D.woi!==undefined){wo.idx=+D.woi;skipPick=null;render();window.scrollTo({top:0});return}
  if(D.wonav){wo.idx+=+D.wonav;skipPick=null;render();window.scrollTo({top:0});return}
  if(D.x3){const k=wo.day+"|"+D.x3;extra[k]=!extra[k];render();return}
  if(b.id==="endWo"||b.id==="endWo2"){finishWorkout();return}
  if(b.id==="pauseWo"){const d=wo.day;wo=null;if(d!==today()){const s=real.sessions[d];if(s&&!s.sets.length){delete real.sessions[d];saveSession(d)}}render();return}
  if(D.feel){const[d,v]=D.feel.split("|");setFeel(d,+v);return}
  if(b.id==="doneSum"){summaryDay=null;render();window.scrollTo({top:0});return}
  if(D.summary){summaryDay=D.summary;render();return}
  if(D.detail){detailDay=D.detail;confirmDel=null;render();window.scrollTo({top:0});return}
  if(b.id==="backDet"){detailDay=null;confirmDel=null;render();return}
  if(D.editday){ensureReal();wo={day:D.editday,idx:0,prog:(real.sessions[D.editday]||{}).prog};detailDay=null;render();window.scrollTo({top:0});return}
  if(D.delsess){deleteSession(D.delsess);return}
  if(b.id==="logPast"){const v=$("#pastDate").value;if(!v||v>=today()){toast("Välj ett datum före idag.");return}
    const pp=$("#pastProg").value;ensureReal();if(!real.sessions[v])real.sessions[v]={sets:[]};real.sessions[v].prog=real.sessions[v].prog||pp;const pid=real.sessions[v].prog;
    wo={day:v,prog:pid,idx:firstOpenStep(real,v,pid)};render();window.scrollTo({top:0});return}
  if(b.id==="manEx"){manageEx=!manageEx;confirmDel=null;render();return}
  if(b.id==="addE"){addEx();return}
  if(D.dele){delEx(D.dele);return}
  if(D.mv){const[id,d]=D.mv.split("|");moveEx(id,+d);return}
  if(D.sx){statEx=D.sx;render();return}
  if(D.range){statRange=D.range;render();return}
  if(b.id==="auIn"){setMeta({email:($("#auEmail").value||"").trim()});authDo("in");return}
  if(b.id==="auUp"){setMeta({email:($("#auEmail").value||"").trim()});authDo("up");return}
  if(b.id==="auSkip"){setMeta({skipLogin:true});authMode=false;authMsg="";render();return}
  if(b.id==="goLogin"){authMode=true;authMsg="";render();window.scrollTo({top:0});return}
  if(b.id==="syncNow"){meta().dirty?push():pull();return}
  if(b.id==="logout"){(async()=>{try{if(meta().dirty)await push();await sb.auth.signOut()}catch(err){}sbUser=null;setMeta({skipLogin:false});authMode=true;authMsg="Du är utloggad.";render()})();return}
  if(b.id==="gear"){tab=tab==="settings"?"day":"settings";confirmDel=null;render();window.scrollTo({top:0});return}
  if(D.goset){tab="settings";render();window.scrollTo({top:0});return}
  if(D.gostats){tab="stats";render();window.scrollTo({top:0});return}
  if(D.pf){const[k,v]=D.pf.split("|");ensureReal();real.profile=Object.assign(prof(real),{[k]:k==="board"?v==="1":v});saveConfig();if(k==="board")boardSync();render();return}
  if(b.id==="pfSave"){ensureReal();const hgt=parseInt($("#pfHeight").value,10),br=parseInt($("#pfBirth").value,10);
    if($("#pfHeight").value&&!(hgt>=120&&hgt<=230)){toast("Skriv längden i cm, t.ex. 182.");return}
    if($("#pfBirth").value&&!(br>=1920&&br<=new Date().getFullYear()-10)){toast("Skriv födelseåret med fyra siffror, t.ex. 1998.");return}
    real.profile=Object.assign(prof(real),{name:$("#pfName").value.trim().slice(0,30),height:hgt||"",birth:br||""});saveConfig();boardSync();toast("Profilen är sparad.");render();return}
  if(b.id==="guideT"){guideOpen=!guideOpen;render();return}
  if(D.copy){copyText(D.copy==="url"?INGEST():D.copy==="key"?SUPA.key:health.token||"");return}
  if(D.ci){const[k,v]=D.ci.split("|"),val=v==="y"?true:v==="n"?false:+v;ciDraft[k]=ciDraft[k]===val?undefined:val;if(ciDraft[k]===undefined)delete ciDraft[k];render();return}
  if(D.sore){const[m,v]=D.sore.split("|");ciDraft.sore=ciDraft.sore||{};ciDraft.sore[m]=ciDraft.sore[m]===+v?undefined:+v;if(ciDraft.sore[m]===undefined)delete ciDraft.sore[m];render();return}
  if(b.id==="ciSave"){if(!Object.keys(ciDraft).length){toast("Svara på minst en fråga, eller tryck Inte idag.");return}
    const pw=$("#ciPainWhere");if(pw)ciDraft.painWhere=pw.value.trim().slice(0,60);ensureReal();real.checkins[today()]=Object.assign({},ciDraft,{at:Date.now()});ciDraft={};saveMonth(today());toast("Tack! Svaren är sparade.");render();return}
  if(b.id==="ciSkip"){setMeta({ciSkip:today()});render();return}
  if(b.id==="measOpen"||D.measgo){measureOpen=true;tab="day";sel=today();render();if(D.measgo)window.scrollTo({top:0});return}
  if(b.id==="measClose"){measureOpen=false;render();return}
  if(b.id==="measSave"){const o={};let bad=false;MEAS.forEach(([k])=>{const el=$("#ms-"+k),v=el?el.value.trim():"";if(!v)return;const n=num(v);if(n>5&&n<250)o[k]=Math.round(n*10)/10;else bad=true});
    if(bad){toast("Ett mått ser fel ut. Skriv i cm, t.ex. 84,5.");return}if(!Object.keys(o).length){toast("Fyll i minst ett mått.");return}
    ensureReal();real.measures[today()]=o;saveMonth(today());measureOpen=false;toast("Måtten är sparade.");render();return}
  if(D.walk){const w=D.walk,mi=parseInt($("#wk-min").value,10),inc=num($("#wk-inc").value),spd=num($("#wk-spd").value);
    if(!(mi>0&&mi<=180)){toast("Skriv minuter, t.ex. 20.");return}if(!(inc>=0&&inc<=15)){toast("Lutningen ska vara mellan 1 och 15 %.");return}if(!(spd>0&&spd<=20)){toast("Skriv hastigheten i km/h, t.ex. 5,2.");return}
    const s=clone(real.sessions[wo.day]||{sets:[]});s.walks=s.walks||{};s.walks[w]={min:mi,inc:Math.round(inc*10)/10,spd:Math.round(spd*10)/10,at:(s.walks[w]&&s.walks[w].at)||Date.now()};
    if(s.skipWalk)delete s.skipWalk[w];real.sessions[wo.day]=s;saveSession(wo.day);toast("Gången är sparad.");render();return}
  if(D.skipw){const s=clone(real.sessions[wo.day]||{sets:[]});s.skipWalk=Object.assign({},s.skipWalk,{[D.skipw]:true});real.sessions[wo.day]=s;saveSession(wo.day);wo.idx++;render();window.scrollTo({top:0});return}
  if(D.unskipw){const s=clone(real.sessions[wo.day]);if(s.skipWalk)delete s.skipWalk[D.unskipw];real.sessions[wo.day]=s;saveSession(wo.day);render();return}
  if(D.skipask!==undefined){skipPick=D.skipask||null;render();return}
  if(D.skip){const i=D.skip.indexOf("|"),ex=D.skip.slice(0,i),r=D.skip.slice(i+1);const s=clone(real.sessions[wo.day]||{sets:[]});s.skip=Object.assign({},s.skip,{[ex]:r});real.sessions[wo.day]=s;skipPick=null;saveSession(wo.day);wo.idx++;render();window.scrollTo({top:0});return}
  if(D.unskip){const s=clone(real.sessions[wo.day]);if(s.skip)delete s.skip[D.unskip];real.sessions[wo.day]=s;saveSession(wo.day);render();return}
  if(D.exp){const s=clone(real.sessions[wo.day]||{sets:[]});if(D.exp==="0"){s.expNo=true}else{const[,ex,type]=D.exp.split("|");s.exp={ex,type,acc:true};if(type==="third")extra[wo.day+"|"+ex]=true;
      for(const k in drafts)if(k.startsWith(wo.day+"|"+ex+"|"))delete drafts[k]}real.sessions[wo.day]=s;saveSession(wo.day);render();return}
  if(D.rir){const[ex,k,v]=D.rir.split("|");const s=clone(real.sessions[wo.day]);const st=s.sets.find(x=>x.e===ex&&(x.n||0)===+k);if(st){st.rir=st.rir===+v?undefined:+v;if(st.rir===undefined)delete st.rir}real.sessions[wo.day]=s;saveSession(wo.day);render();return}
  if(b.id==="dlStart"){ensureReal();real.deloadUntil=addDays(today(),6);real.lastDeload=today();saveConfig();toast("Lätt vecka startad. Förslagen är 20 % lättare.");render();return}
  if(b.id==="dlSkip"){setMeta({dlSkip:addDays(today(),7)});render();return}
  if(b.id==="dlEnd"){ensureReal();real.deloadUntil=null;saveConfig();render();return}
  if(D.goal){const v=num($("#goalIn").value);ensureReal();if(!$("#goalIn").value.trim()){delete real.goals[D.goal];saveConfig();render();return}
    if(!(v>0&&v<1000)){toast("Skriv målet i kg, t.ex. 100.");return}real.goals[D.goal]=Math.round(v*10)/10;saveConfig();toast("Målet är sparat.");render();return}
  if(D.musopen){musEdit=musEdit===D.musopen?null:D.musopen;render();return}
  if(D.mus){const[id,m]=D.mus.split("|");ensureReal();const e=real.exercises.find(x=>x.id===id);if(!e)return;const cur=musclesOf(real,id).slice(),i=cur.indexOf(m);i>-1?cur.splice(i,1):cur.push(m);e.m=cur;saveConfig();render();return}
  if(b.id==="bkToggle"){backupOpen=!backupOpen;confirmDel=null;render();return}
  if(b.id==="bkCopy"){const ta=$("#bkOut");const fb=()=>{ta.focus();ta.select();toast("Markerat. Kopiera med kopiera-menyn.")};
    try{navigator.clipboard.writeText(ta.value).then(()=>toast("Kopierat."),fb)}catch(err){fb()}return}
  if(b.id==="bkImport"){let o;try{o=JSON.parse($("#bkIn").value)}catch(err){toast("Texten går inte att läsa. Klistra in hela säkerhetskopian.");return}
    if(!o||!Array.isArray(o.exercises)||typeof o.sessions!=="object"){toast("Det där ser inte ut som en Formlogg-kopia.");return}
    if(confirmDel!=="import"){confirmDel="import";render();return}
    const old=Object.keys(real.sessions);demoOn=false;demoDismissed=true;real=Object.assign(DEFAULT(),o);migrate(real);confirmDel=null;backupOpen=false;saveAll(old);toast("Din logg är inläst.");render();return}
});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="ciPainWhere"){ciDraft.painWhere=el.value;return}if(el.dataset&&el.dataset.dk){const dk=el.dataset.dk;if(!drafts[dk]){const[d,ex,k]=dk.split("|");drafts[dk]=Object.assign({},defaultDraft(d,ex,+k))}drafts[dk][el.dataset.k]=el.value}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const el=e.target;
  if(el.id==="auPw"&&!authBusy){authDo("in");return}
  if(el.id==="newHabit")addHabit();else if(el.id==="newEx")addEx();else if(el.id==="progName")renameProg();else if(el.id==="bwIn")saveBody();
  else if(el.dataset&&el.dataset.dk){const[,ex,k]=el.dataset.dk.split("|");el.blur();woSet(ex,+k)}});

setInterval(()=>{const s=real.sessions[today()];
  document.querySelectorAll('[data-clock="sess"]').forEach(el=>{const day=wo?wo.day:today(),x=real.sessions[day]||s;if(x&&x.start)el.textContent=clock((x.end||Date.now())-x.start)});

render();
initStore();
})();
