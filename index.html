<style>
/* Layout: dark glass cards on a near-black field with soft light pools; white is the only accent, semantic colors carry state */
:root{
  --bg:#08080A; --card:#121215; --card2:#17171B; --card3:#1D1D22;
  --panel:#121215; --panel2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --line3:rgba(255,255,255,.2);
  --fg:#EDEDEF; --soft:#B4B4BC; --muted:#8A8A94; --dim:#5E5E68;
  --pri:#EDEDEF; --pri-dim:rgba(255,255,255,.07); --ink:#0A0A0A;
  --info:#9DB8FF; --info-dim:rgba(157,184,255,.1);
  --vio:#C7B8FF; --good:#7EE2A8; --good-dim:rgba(126,226,168,.1); --warn:#F5C76B; --bad:#F28B82; --bad-dim:rgba(242,139,130,.1);
  --r:18px; --r-s:12px; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -24px rgba(0,0,0,.8);
  --f-display:"Sora","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100vh;background-color:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 10% -8%,rgba(255,255,255,.07),transparent 60%),
  radial-gradient(600px 420px at 100% 0%,rgba(157,184,255,.05),transparent 60%),
  radial-gradient(800px 520px at 50% 115%,rgba(255,255,255,.035),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(108px + env(safe-area-inset-bottom,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,8,10,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:17px;color:var(--fg);display:flex;align-items:center;gap:9px}
.brand i{width:18px;height:18px;border-radius:6px;background:linear-gradient(180deg,#fff 0%,#d9d9de 100%);display:inline-block;box-shadow:0 6px 16px -6px rgba(255,255,255,.5)}
.sync{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dim)}
.sync.on{color:var(--soft)}
.sync.on::before{background:var(--good);box-shadow:0 0 8px var(--good)}
.datenav{display:flex;align-items:center;gap:6px;margin:12px auto 0;max-width:560px}
.datenav button.arr{width:38px;height:38px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--soft);font-size:18px}
.datenav button.arr:disabled{opacity:.3}
.dlabel{flex:1;text-align:center}
.dlabel b{display:block;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.03em}
.dlabel span{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

.demo{margin-top:14px;border:1px solid var(--line2);background:var(--info-dim);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
.demo b{font-family:var(--f-mono);font-weight:500;color:var(--info);text-transform:uppercase;letter-spacing:.1em;font-size:10px;display:block}
.demo button{border:1px solid var(--line2);border-radius:10px;color:var(--fg);padding:7px 10px;font-size:12px;white-space:nowrap}

.sec{display:none;flex-direction:column;gap:12px;padding-top:16px}
.sec.on{display:flex}
.mod{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;min-width:0}
.hud{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border-color:var(--line2)}
.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl button{color:var(--soft);letter-spacing:.1em;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line2);border-radius:999px}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0;margin:0}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--fg);border-radius:var(--r-s);padding:0 16px;font-size:14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 8px 24px -10px rgba(255,255,255,.45)}
.btn.ghost{border-color:var(--line);color:var(--soft);background:none}
.btn.cyan{border-color:rgba(157,184,255,.35);color:var(--info);background:var(--info-dim)}
.btn.warn{border-color:rgba(242,139,130,.35);color:var(--bad);background:var(--bad-dim)}
.btn.warn.sure{background:var(--bad);color:#1a0505}
.btn:disabled{opacity:.35}
.addrow{display:flex;gap:8px}
.inp,.addrow input{flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:var(--r-s);padding:11px 13px;font-size:16px}
.inp::placeholder,.addrow input::placeholder{color:var(--dim)}

/* day */
.dayhead{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.dayinfo{min-width:0;display:flex;flex-direction:column;gap:6px}
.dayinfo .big{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.dayinfo p{margin:0;color:var(--muted);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.week button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 0;border-radius:12px;border:1px solid transparent}
.week button.sel{border-color:var(--line2);background:rgba(255,255,255,.04)}
.week span{font-family:var(--f-mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.week i{width:100%;max-width:26px;height:26px;display:block;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.habits{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hrow2{display:flex;gap:8px;align-items:center}
.habit{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);text-align:left;width:100%;min-width:0;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.habit:active{transform:scale(.985)}
.box{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line3);display:grid;place-items:center;flex:none;transition:all .2s var(--ease)}
.box svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .2s var(--ease)}
.habit.done{border-color:var(--line3);background:rgba(255,255,255,.06)}
.habit.done .box{background:linear-gradient(180deg,#fff,#e4e4e8);border-color:transparent;box-shadow:0 6px 16px -6px rgba(255,255,255,.55)}
.habit.done .box svg{opacity:1;transform:none}
.habit .t{flex:1;min-width:0}
.habit .t b{display:block;font-weight:600;font-size:15px}
.habit .t span{font-size:12px;color:var(--muted)}
.habit .st{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.04em;color:var(--fg);font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.habit .st small{display:block;font-family:var(--f-mono);font-size:8px;color:var(--muted);letter-spacing:.14em;font-weight:400;margin-top:4px}
.del{color:var(--bad);font-size:12px;font-weight:600;border:1px solid rgba(242,139,130,.3);background:var(--bad-dim);border-radius:10px;padding:9px 10px;white-space:nowrap}
.del.sure{background:var(--bad);color:#1a0505}
.bw{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cta b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.03em;display:block}
.cta span{font-size:13px;color:var(--muted)}

.field{position:relative;min-width:0;display:block}
.field input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:var(--r-s);padding:12px 40px 12px 13px;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;transition:border-color .2s}
.field input:focus{border-color:var(--line3);outline:none;background:rgba(255,255,255,.05)}
.field input::placeholder{color:var(--dim)}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted);pointer-events:none}

/* pass home */
.start{display:flex;flex-direction:column;gap:14px}
.start h2{font-size:26px;letter-spacing:-.045em}
.bigbtn{width:100%;min-height:62px;border-radius:16px;background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(0,0,0,.08) inset,0 14px 34px -12px rgba(255,255,255,.45);transition:transform .15s var(--ease)}
.bigbtn:active{transform:scale(.98)}
.bigbtn svg{width:18px;height:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.facts b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.15}
.facts span{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.prog{display:flex;flex-direction:column;margin-top:8px}
.pitem{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .n{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.pitem b{font-weight:600;display:block;min-width:0}
.pitem small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pitem .tr{font-family:var(--f-mono);font-size:12px;text-align:right;white-space:nowrap}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.mgrid{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mgrid span{min-width:0;overflow-wrap:anywhere}
.mgrid button.mv{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);color:var(--soft)}
.mgrid button.mv:disabled{opacity:.25}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list button:last-child{border-bottom:0}
.list b{font-weight:600;display:block}
.list span{font-size:12px;color:var(--muted)}
.list .r{font-family:var(--f-mono);font-size:12px;color:var(--soft);text-align:right;white-space:nowrap}
.flag{border:1px solid rgba(157,184,255,.25);background:var(--info-dim);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}

.pcard{display:grid;grid-template-columns:1fr auto;grid-template-areas:"top go" "meta go";gap:6px 12px;align-items:center;text-align:left;width:100%;padding:16px 16px 15px 18px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:var(--shadow);transition:transform .15s var(--ease)}
.pcard:active{transform:scale(.985)}
.pc-top{grid-area:top;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.pc-top b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.pc-top em{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(10,10,10,.08);border:1px solid rgba(10,10,10,.15)}
.pc-meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.pc-go{grid-area:go;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.pc-go svg{width:16px;height:16px}
.pcard.next{background:linear-gradient(180deg,#fff 0%,#ececef 100%);color:var(--ink);border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 34px -14px rgba(255,255,255,.45)}
.pcard.next .pc-meta{color:#55555e}
.pcard.next .pc-go{background:var(--ink);color:#fff;border-color:transparent}
.lastp{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.lastp .lbl{display:block;margin-bottom:3px}
.lastp b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.03em}
.lastp small{font-size:12px;color:var(--muted)}
.lastp .r{font-size:12px;font-weight:600;color:var(--soft);white-space:nowrap}
.addrow.past{flex-wrap:wrap}
.addrow.past .inp{flex:1 1 130px}
.addrow.past .btn{flex:1 1 100%}
select.inp{appearance:none;-webkit-appearance:none;color:var(--fg)}
.hright{display:flex;align-items:center;gap:10px}
.gear{width:34px;height:34px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;color:var(--soft)}
.gear svg{width:18px;height:18px}
.gear.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink);border-color:transparent}
.q{display:flex;flex-direction:column;gap:7px;padding:12px 0;border-bottom:1px solid var(--line)}
.q>span{font-size:14px;font-weight:500}
.q small{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.q small i{font-style:normal}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.sc.yn{grid-template-columns:1fr 1fr}.sc.s3{grid-template-columns:repeat(3,1fr)}
.sc button{min-height:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-weight:600;font-size:14px;color:var(--soft)}
.sc button.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink);border-color:transparent}
.sorer{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.sorer em{font-style:normal;font-size:13px;color:var(--soft)}
.ci .inp{margin-top:8px}
.rdy .rdyrow{display:flex;align-items:center;gap:14px;margin-top:10px}
.rdy .rdyrow b{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.05em;line-height:1}
.rdy .rdyrow .bar{flex:1;grid-column:auto}
.rdy small{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
.sugg{border:1px solid rgba(157,184,255,.25);background:var(--info-dim);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.sugg em{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--info)}
.sugg b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:-.03em}
.sugg small{font-size:12px;color:var(--soft)}
.howto{border:1px solid rgba(157,184,255,.25);background:var(--info-dim);border-radius:14px;padding:12px 14px}
.howto em{font-style:normal;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--info)}
.howto ol{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--soft)}
.howto b{color:var(--fg)}
.sec>.howto{margin:0}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wgrid .field input{padding-right:46px;font-size:17px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(245,199,107,.12);color:var(--warn);border:1px solid rgba(245,199,107,.3)}
.expc{border-color:rgba(245,199,107,.3);background:linear-gradient(180deg,rgba(245,199,107,.08),rgba(245,199,107,.02))}
.expc p{margin:8px 0 4px;font-size:15px;font-weight:500}
.expc small{font-size:12px;color:var(--muted)}
.expc .lbl span:last-child{color:var(--warn)}
.seg.walk{flex:.55;background:rgba(157,184,255,.15)}
.seg.walk.done{background:var(--info);box-shadow:0 0 10px rgba(157,184,255,.4)}
.seg.skip{background:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 3px,transparent 3px 6px)}
.rir{display:inline-flex;align-items:center;gap:4px}
.rir button{min-width:26px;height:22px;border-radius:999px;border:1px solid var(--line2);font-family:var(--f-mono);font-size:10px;color:var(--soft);padding:0 6px}
.rir button.on{background:var(--pri);color:var(--ink);border-color:transparent}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.woprev i{font-style:normal;color:var(--muted);font-size:11px}
.board{display:flex;flex-direction:column;margin-top:8px}
.board div{display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"pos name pts" "pos name tot";gap:0 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.board div:last-child{border-bottom:0}
.board .pos{grid-area:pos;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--muted);text-align:center}
.board b{grid-area:name;font-weight:600;min-width:0;overflow-wrap:anywhere}
.board b small{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-left:6px}
.board .pts{grid-area:pts;font-family:var(--f-display);font-weight:600;font-size:18px;text-align:right}
.board .tot{grid-area:tot;font-size:11px;color:var(--dim);text-align:right}
.board div.me{background:rgba(255,255,255,.04);border-radius:12px;padding:10px 8px;border-bottom-color:transparent}
.board div:first-child .pos{color:var(--fg)}
.copyrow{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.copyrow span{font-size:12px;color:var(--muted)}
.copyrow code{font-family:var(--f-mono);font-size:11px;color:var(--soft);overflow-wrap:anywhere;min-width:0}
.copyrow .btn{min-height:34px;padding:0 10px;font-size:12px}
.form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg3.big{display:flex}.seg3.big button{flex:1;font-family:var(--f-body);font-size:13px;font-weight:600;padding:9px 6px}
.tog{flex-direction:row!important;justify-content:space-between;align-items:center}
.tog span{color:var(--fg);font-size:14px}
.switch{width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.switch.on{background:var(--good)}.switch.on i{transform:translateX(20px)}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mgrid2 .field input{padding-right:84px;font-size:16px}
.guide{margin-top:14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.guide li{color:var(--soft)}
.guide b{color:var(--fg)}
.guide .tscroll table td,.guide .tscroll table th{font-size:11px}
.guide code{font-family:var(--f-mono);font-size:12px;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;color:var(--fg)}
.musc{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 10px}
.musc button{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.musc button.on{background:var(--pri);color:var(--ink);border-color:transparent}
.msbar{height:8px;border-radius:999px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.msbar i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.msbar::before,.msbar::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25);z-index:1}
.msbar::before{left:50%}.msbar::after{left:calc(100% - 1px)}
a.btn{text-decoration:none}
/* workout */
.wohead{display:flex;flex-direction:column;gap:12px}
.segs{display:flex;gap:5px}
.seg{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08);min-width:0;transition:background .2s}
.seg.part{background:rgba(255,255,255,.35)}
.seg.done{background:var(--pri);box-shadow:0 0 10px rgba(255,255,255,.35)}
.seg.cur{outline:1.5px solid var(--info);outline-offset:3px}
.woname{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.02;margin:0;letter-spacing:-.05em;text-wrap:balance;overflow-wrap:anywhere}
.woprev{font-size:13px;color:var(--muted)}
.woprev b{font-family:var(--f-mono);color:var(--fg);font-weight:500}
.clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.rows{display:flex;flex-direction:column;gap:10px}
.rh{display:grid;grid-template-columns:30px 1fr 1fr 56px;gap:8px;font-family:var(--f-mono);font-size:9px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.row{display:grid;grid-template-columns:30px 1fr 1fr 56px;gap:8px;align-items:center}
.row .sn{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--dim);text-align:center}
.row.done .sn{color:var(--fg)}
.row.done .field input{border-color:var(--line3);background:rgba(255,255,255,.06)}
.chk{height:50px;border-radius:var(--r-s);border:1px solid var(--line2);background:rgba(255,255,255,.03);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--fg);transition:all .2s var(--ease)}
.chk svg{width:20px;height:20px}
.chk.on{background:linear-gradient(180deg,#fff,#e8e8ec);border-color:transparent;box-shadow:0 8px 20px -10px rgba(255,255,255,.55)}
.chk.edit{border-color:var(--info);color:var(--info)}
.rowmeta{grid-column:2/-1;font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:-4px;display:flex;gap:10px;flex-wrap:wrap}
.rowmeta .pr{background:var(--good);color:#06210f;border-radius:999px;padding:0 7px;letter-spacing:.06em;font-weight:500}
.add3{border:1px dashed var(--line3);border-radius:var(--r-s);color:var(--soft);min-height:44px;font-size:13px;font-weight:600}
.rest{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.wonav{display:grid;grid-template-columns:56px 1fr;gap:8px}
.wonav .btn{min-height:56px;border-radius:16px}
.wonav .btn.solid{font-size:15px}
.wofoot{display:flex;justify-content:space-between;gap:8px}
.wofoot{flex-wrap:wrap}.wofoot #tmpOpen{color:var(--info)}
.wofoot button{font-size:12px;font-weight:500;color:var(--muted);padding:10px 2px}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.feel button{border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.03);padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.feel button b{font-family:var(--f-display);font-size:20px;font-weight:600}
.feel button span{font-size:10px;color:var(--muted)}
.feel button.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink);border-color:transparent}
.feel button.on span{color:#4a4a52}
.cmp{display:flex;flex-direction:column}
.cmp div{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.cmp div:last-child{border-bottom:0}
.cmp span{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.cmp em{font-style:normal;font-family:var(--f-mono);font-size:9px;background:var(--good);color:#06210f;border-radius:999px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.det{display:flex;flex-direction:column;gap:2px}
.det div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.det div:last-child{border-bottom:0}
.det span{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}

/* stats */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:14px}
.heat i{aspect-ratio:1;display:block;border-radius:3px;background:rgba(255,255,255,.04);max-width:100%}
.heat i.f{background:transparent}
.heatlegend{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--f-mono);font-size:9px;color:var(--dim);gap:8px}
.heatlegend span{display:flex;gap:3px;align-items:center}
.heatlegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:14px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--soft);white-space:nowrap;background:rgba(255,255,255,.03)}
.chip.on{background:linear-gradient(180deg,#fff,#ececef);border-color:transparent;color:var(--ink)}
.seg3{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.seg3 button{font-family:var(--f-mono);font-size:10px;padding:5px 9px;border-radius:9px;color:var(--muted)}
.seg3 button.on{background:linear-gradient(180deg,#fff,#ececef);color:var(--ink)}
.strhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.strhead .v{font-family:var(--f-display);font-size:46px;font-weight:600;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}
.strhead .v small{font-size:16px;color:var(--muted);font-weight:500;margin-left:4px;letter-spacing:0}
.strhead .cap{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.delta{font-family:var(--f-mono);font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid}
.delta.up{border-color:rgba(126,226,168,.3);background:var(--good-dim)}
.delta.down{border-color:rgba(242,139,130,.3);background:var(--bad-dim)}
.delta.flat{border-color:var(--line2);background:rgba(255,255,255,.03)}
.legend{display:flex;gap:14px;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;vertical-align:middle;margin-right:6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.grid4 div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.grid4 b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.grid4 span{font-family:var(--f-mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.reps{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reps span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.03)}
.reps span em{font-style:normal;color:var(--dim);margin-right:6px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-weight:400;font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-align:right;padding:6px 0 8px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:11px 0 11px 8px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:13px;text-align:right}
td:first-child{font-family:var(--f-body);font-size:14px;font-weight:500}
td small{display:block;color:var(--dim);font-size:10px}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
textarea{width:100%;min-height:110px;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:12px;color:var(--fg);font-family:var(--f-mono);font-size:11px;padding:10px;resize:vertical}
.foot{font-size:12px;color:var(--dim);margin:2px 0 0}

/* stats: nine areas under a sticky jump bar; dense hairline tiles, charts open below the tile you tap, headings fold their area */
.snav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,59px));z-index:15;margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:6px max(16px,env(safe-area-inset-left,0px));background:rgba(8,8,10,.82);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.srow{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:560px;margin:0 auto}
.srow::-webkit-scrollbar{display:none}
.schip{position:relative;z-index:1;flex:none;min-height:36px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .25s}
.schip.on{color:var(--ink)}
.spill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;background:linear-gradient(180deg,#fff 0%,#ececef 100%);box-shadow:0 8px 20px -10px rgba(255,255,255,.55);transition:transform .4s var(--ease),width .4s var(--ease)}
.sbody{display:flex;flex-direction:column;gap:20px;min-width:0}
.tiprow{display:flex;align-items:center;gap:12px;margin:0 2px -6px 4px}
.tip{flex:1;min-width:0;font-size:12px;line-height:1.4;color:var(--dim);margin:0}
.tiprow .seg3{flex:none}
.tiprow .seg3 button{padding:7px 10px}
.area{display:flex;flex-direction:column;gap:8px;min-width:0}
.ah{font-size:20px;min-width:0}
.ah>button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:2px 4px;border-radius:14px;transition:background .2s}
.ah em{font-style:normal;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--ac);letter-spacing:.08em}
.ah .ttl{flex:1;min-width:0}
.ah .r{font-family:var(--f-mono);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fc{flex:none;align-self:center;width:6px;height:6px;margin:3px 3px 0 1px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);transform:rotate(-135deg);transition:transform .3s var(--ease)}
.area.fold .ah{font-size:16px}
.area.fold .ah>button{align-items:center;padding:13px 12px 13px 14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:var(--shadow)}
.area.fold .ah>button:active{background:rgba(255,255,255,.07)}
.area.fold .ah .ttl{flex:none;white-space:nowrap}
.area.fold .ah .r{flex:1;min-width:0;text-align:right;font-family:var(--f-body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--soft);overflow:hidden;text-overflow:ellipsis}
.area.fold .fc{transform:rotate(45deg);margin:-3px 3px 0 1px}
.area.fold+.area.fold{margin-top:-12px}
.ac{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.ac>*+*{border-top:1px solid var(--line)}
.ac>.strip+*{border-top:0}
.strip{display:grid;grid-template-columns:repeat(60,minmax(0,1fr));margin-right:-1px}
.tl{position:relative;min-width:0;padding:9px 12px 8px;display:flex;flex-direction:column;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;transition:background .2s}
.tl>span{font-family:var(--f-mono);font-size:9px;line-height:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.tl>b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:24px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap;position:relative;z-index:1}
.tl>b.sm{font-size:16px}.tl>b.xs{font-size:14px;letter-spacing:-.02em}
.tl>b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px;letter-spacing:0}
.tl>i{font-style:normal;font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.tl>i.up{color:var(--good)}.tl>i.down{color:var(--bad)}
.warnc{color:var(--warn)}
/* the trend sits to the right of the number, on the same line */
.spk{position:absolute;right:11px;top:23px;width:34%;height:20px;pointer-events:none}
button.tl>span{padding-right:14px}
button.tl::after{content:"";position:absolute;top:10px;right:10px;width:5px;height:5px;border-right:1.5px solid var(--ac);border-bottom:1.5px solid var(--ac);transform:rotate(45deg);transition:transform .3s var(--ease)}
button.tl.go::after{transform:rotate(-45deg);top:11px}
button.tl.go>i{color:var(--ac)}
button.tl:active{background:rgba(255,255,255,.08)}
button.tl.open{background:rgba(255,255,255,.06)}
button.tl.open::after{transform:translateY(3px) rotate(225deg)}
.strip.p4 .tl,.strip.p5 .tl{padding:9px 9px 8px}
.strip.p4 .tl>b{font-size:17px}.strip.p5 .tl>b{font-size:16px}
.strip.p4 .tl>b.sm{font-size:15px}
.strip.p4 button.tl>span,.strip.p5 button.tl>span{padding-right:11px}
.strip.p4 button.tl::after,.strip.p5 button.tl::after{right:7px}
.strip.p4 .spk,.strip.p5 .spk{right:8px;width:32%;height:18px;top:24px}
.tl.lv2 .spk,.strip.p4 .tl.lv .spk{width:20%}
.dp,.exd{overflow:hidden}
.strip>.dp{grid-column:1/-1;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.dpi{padding:11px 12px}
.dph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:18px}
.dph>span:first-child{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ro{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.ro b{font-weight:500;color:var(--fg);font-size:13px}
.ro i{font-style:normal}
.scrub{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin-top:4px;cursor:crosshair}
.scrub svg{display:block;width:100%;height:auto;overflow:visible}
.scrub .cur,.scrub .cd{transition:opacity .15s}
.dpn{margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--muted)}
.blk{padding:12px 14px}
.bh{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bh.pad{padding:10px 14px 9px;margin:0}
.hint{margin:0;padding:10px 14px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.use{margin:0;padding:9px 14px 10px;font-size:12px;line-height:1.45;color:var(--soft);background:rgba(255,255,255,.022)}
.use b{color:var(--ac);font-weight:600}
.rdx{display:flex;align-items:center;gap:14px;padding:13px 14px}
.rdring{position:relative;width:72px;height:72px;flex:none}
.rdring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rdring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rg{stroke-dasharray:188.5;stroke-dashoffset:var(--o)}
.rdtxt{min-width:0;display:flex;flex-direction:column;gap:3px}
.rdtxt b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.rdtxt span{font-size:12.5px;line-height:1.4;color:var(--muted)}
.pr{display:grid;grid-template-columns:78px minmax(0,1fr) 54px 24px;gap:8px;align-items:center;min-height:25px}
.pr>span{font-size:13px;color:var(--soft)}
.pr>em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr>b{font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:right}
.pr>.nb{grid-column:3/-1;justify-self:end;font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap}
.sbar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.sbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ac)}
.tag.nx{color:var(--info);border-color:rgba(157,184,255,.35);background:var(--info-dim);margin-left:6px;vertical-align:2px;font-weight:400}
.ms{display:grid;grid-template-columns:92px minmax(0,1fr) 30px 24px;gap:8px;align-items:center;min-height:25px}
.ms>span{font-size:13px;color:var(--soft);white-space:nowrap}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const fmt=(n,d=0)=>Number(n).toLocaleString("sv-SE",{maximumFractionDigits:d,minimumFractionDigits:0});
const sgn=(n,d=1)=>(n>0?"+":n<0?"−":"±")+fmt(Math.abs(n),d);
const e1rm=(kg,r)=>r<=1?kg:kg*(1+r/30);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const DAYS=["sön","mån","tis","ons","tor","fre","lör"];
const DAYS_LONG=["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
const DAYS_PL=["söndagar","måndagar","tisdagar","onsdagar","torsdagar","fredagar","lördagar"];
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const shortDate=s=>{const d=parse(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
const dayName=s=>{const df=daysBetween(s,today());return df===0?"Idag":df===1?"Igår":DAYS_LONG[parse(s).getDay()]+" "+shortDate(s)};
const mondayOf=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const clock=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+pad(m):m)+":"+pad(s%60)};
const fmtDur=m=>m==null?"–":m<60?Math.round(m)+" min":Math.floor(m/60)+" h "+pad(Math.round(m%60))+" min";
const num=v=>parseFloat(String(v==null?"":v).replace(",","."));
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="#0A0A0A" stroke-width="2.4"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const CHECKA='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
const BASE_SETS=2, MAX_SETS=3;

/* ---------- state ---------- */
const DEF_EX=[["bench","Bänkpress"],["incdb","Lutande hantelpress"],["dips","Dips"],["pushdown","Triceps pushdown"],
  ["dead","Marklyft"],["chins","Chins"],["row","Skivstångsrodd"],["facepull","Face pulls"],["curl","Bicepscurl"],
  ["squat","Knäböj"],["rdl","Rumänsk marklyft"],["legpress","Benpress"],["legcurl","Bencurl"],["calf","Vadpress"],
  ["ohp","Axelpress"],["latraise","Sidolyft"],["revfly","Omvända flyes"],["hlr","Hängande benlyft"],["backext","Ryggresningar"]];
const DEF_PROGS=()=>[{id:"push",name:"Push",draft:true,ex:["bench","incdb","dips","pushdown"]},{id:"pull",name:"Pull",draft:true,ex:["dead","chins","row","facepull","curl"]},
  {id:"legs",name:"Legs",draft:true,ex:["squat","rdl","legpress","legcurl","calf"]},{id:"core",name:"Axlar, bål & ländrygg",draft:true,ex:["ohp","latraise","revfly","hlr","backext"]}];
const DEFAULT=()=>({
  habits:[{id:"eat",name:"Ätit bra"},{id:"train",name:"Tränat",auto:true}],
  exercises:DEF_EX.map(([id,name])=>({id,name})), programs:DEF_PROGS(),
  days:{}, body:{}, sessions:{}, profile:{}, checkins:{}, measures:{}, goals:{}, deloadUntil:null, lastDeload:null
});
function migrate(R){let ch=false;
  if(!Array.isArray(R.exercises))R.exercises=[];
  if(!Array.isArray(R.programs)||!R.programs.length){R.programs=DEF_PROGS();ch=true}
  const have=new Set(R.exercises.map(e=>e.id));
  R.programs.forEach(p=>{if(!Array.isArray(p.ex))p.ex=[];p.ex.forEach(id=>{if(!have.has(id)){const d=DEF_EX.find(x=>x[0]===id);R.exercises.push({id,name:d?d[1]:id});have.add(id);ch=true}})});
  if("programSet" in R){delete R.programSet;ch=true}
  ["profile","checkins","measures","goals"].forEach(k=>{if(!R[k]||typeof R[k]!=="object"){R[k]={}}});
  return ch}
let real=DEFAULT(), demo=null, demoOn=false, demoDismissed=false;
let tab="day", sel=today(), statEx=null, statRange="all";
let editHabits=false, manageEx=false, confirmDel=null, viewProg=null;
let wo=null, summaryDay=null, detailDay=null, backupOpen=false, skipPick=null, musEdit=null, tmpAdd=false;
const drafts={}, extra={};
const V=()=>demoOn?demo:real;
const hasData=s=>Object.keys(s.days).length>0||Object.keys(s.sessions).length>0||Object.keys(s.body||{}).length>0||Object.keys(s.checkins||{}).length>0||Object.keys(s.measures||{}).length>0;

/* ---------- demo: 12 weeks of the same program, 3 pass a week ---------- */
function buildDemo(){
  const d=DEFAULT();d.habits.splice(1,0,{id:"sleep",name:"Sovit 7 h+"});
  const base={bench:62.5,squat:80,dead:100,ohp:40,row:55,incdb:22,dips:10,pushdown:25,chins:5,facepull:20,curl:14,rdl:70,legpress:120,legcurl:35,calf:60,latraise:8,revfly:7,hlr:0,backext:10},step={};
  let seed=11;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  let n=0;
  for(let i=84;i>=1;i--){
    const day=addDays(today(),-i),wd=parse(day).getDay(),list=[];
    const slept=rnd()>.3;if(slept)list.push("sleep");
    const ate=rnd()>(slept?.18:.5);if(ate)list.push("eat");
    const trains=((wd===1||wd===3||wd===5)&&rnd()>(ate?.06:.3))||(wd===6&&rnd()>.85);
    if(trains){
      n++;list.push("train");
      const start=parse(day).getTime()+(16.5+rnd()*2)*36e5;let t=start+6*6e4;const sets=[];
      const pg=d.programs[(n-1)%d.programs.length];
      progExs(d,pg).forEach(ex=>{
        const w=Math.round(((base[ex.id]||20)*(1+.0035*n))/1.25)*1.25,cnt=rnd()>.75?3:2;
        for(let k=0;k<cnt;k++){const r=Math.max(4,8-k-(rnd()>.65?1:0)-(slept?0:1));t+=(2+rnd()*1.5)*6e4;sets.push({e:ex.id,kg:w,r,n:k,t})}
        t+=2*6e4;
      });
      d.sessions[day]={prog:pg.id,walks:{pre:{min:20,inc:6,spd:5,at:start-4*6e4},post:{min:20,inc:Math.min(15,7+Math.floor(n/8)),spd:5.2,at:t+25*6e4}},start,end:t+3*6e4,feel:Math.max(1,Math.min(5,Math.round(3+(slept?.8:-.6)+(ate?.3:0)+(rnd()-.5)*1.4))),sets};
    }
    if(rnd()>.25)d.checkins[day]={energy:slept?4:2,stress:2+Math.round(rnd()*2),mood:3+Math.round(rnd()),motiv:slept?4:3,food:ate?4:2,protein:ate,alcohol:rnd()>.85,pain:false};
    if(i%3===0)d.measures[day]={waist:Math.round((86+i*.03)*10)/10,neck:38.5,hip:98,arm:36.5,chest:102,thigh:58};
    if(rnd()>.45)d.body[day]=Math.round((80.4+i*.02+(rnd()-.5)*.7)*10)/10;
    if(list.length)d.days[day]=list;
  }
  return d;
}

/* ---------- storage: claude db when available, else this device ---------- */
const LKEY="formlogg-v1";
let store={mode:"local"}, ready=false, cfgMissing=true;
function loadLocal(){try{const r=localStorage.getItem(LKEY);if(r){real=Object.assign(DEFAULT(),JSON.parse(r));cfgMissing=migrate(real)}}catch(e){}}
function persistLocal(){if(store.mode==="db")return;try{localStorage.setItem(LKEY,JSON.stringify(real))}catch(e){}
  if(store.mode==="supa"){setMeta({dirty:true});schedulePush()}}

/* ---------- cloud sync (standalone app with Supabase) ---------- */
const SUPA=window.FORMLOGG_SUPA&&window.supabase&&window.supabase.createClient?window.FORMLOGG_SUPA:null;
let sb=null,sbUser=null,syncTimer=null,authMode=false,authMsg="",authBusy=false;
const MKEY="formlogg-meta";
function meta(){try{return JSON.parse(localStorage.getItem(MKEY)||"{}")}catch(e){return{}}}
function setMeta(m){try{localStorage.setItem(MKEY,JSON.stringify(Object.assign(meta(),m)))}catch(e){}}
function schedulePush(){clearTimeout(syncTimer);syncTimer=setTimeout(push,1200)}
async function push(){
  if(!sbUser){setSync("Bara telefonen");return}
  if(!navigator.onLine){setSync("Offline · sparas sen");return}
  setSync("Sparar…");
  try{const {data,error}=await sb.from("formlogg").upsert({user_id:sbUser.id,data:real,updated_at:new Date().toISOString()}).select("updated_at").single();
    if(error)throw error;setMeta({dirty:false,synced:data.updated_at,uid:sbUser.id});setSync("Synkad",true);
    if(Date.now()-boardPushT>30000){boardPushT=Date.now();boardSync()}}
  catch(e){setSync("Ej synkad");schedulePushLater()}
}
let laterT;function schedulePushLater(){clearTimeout(laterT);laterT=setTimeout(()=>{if(meta().dirty)push()},30000)}
async function pull(){
  if(!sbUser)return;setSync("Synkar…");
  try{
    const {data,error}=await sb.from("formlogg").select("data,updated_at").eq("user_id",sbUser.id).maybeSingle();
    if(error)throw error;const m=meta(),sameUser=m.uid===sbUser.id;
    if(!data){if(hasData(real))await push();else setSync("Synkad",true);return}
    if(sameUser&&m.dirty&&hasData(real)){await push();return}
    if(!sameUser||data.updated_at!==m.synced){
      real=Object.assign(DEFAULT(),data.data||{});cfgMissing=migrate(real);
      try{localStorage.setItem(LKEY,JSON.stringify(real))}catch(e){}
      setMeta({synced:data.updated_at,dirty:false,uid:sbUser.id});
      if(hasData(real)){demoOn=false;demoDismissed=true}
      if(!wo)resumeActive();render();
    }
    setSync("Synkad",true);
  }catch(e){setSync("Offline")}
}
async function authDo(kind){
  const email=($("#auEmail").value||"").trim(),pw=$("#auPw").value||"";
  if(!/^\S+@\S+\.\S+$/.test(email)){authMsg="Skriv en giltig e-postadress.";render();return}
  if(pw.length<6){authMsg="Lösenordet behöver minst 6 tecken.";render();return}
  authBusy=true;authMsg=kind==="up"?"Skapar konto…":"Loggar in…";render();

    const check=()=>{if(got.c&&got.m&&got.s){clearTimeout(timer);setSync("Synkad",true);if(!ready)finish();else render()}};
    const err=()=>{setSync("Sparas ej");toast("Din logg går inte att nå just nu.")};
    cfg.onSnapshot(s=>{if(s.exists){const d=s.data();real.habits=clone(d.habits||[]);real.exercises=clone(d.exercises||[]);real.programs=clone(d.programs||[]);real.programSet=d.programSet;real.profile=clone(d.profile||{});real.goals=clone(d.goals||{});real.deloadUntil=d.deloadUntil||null;real.lastDeload=d.lastDeload||null;cfgMissing=migrate(real)}got.c=1;check()},err);
    store.months.onSnapshot(q=>{const o={days:{},body:{},checkins:{},measures:{}};q.docs.forEach(d=>{const x=d.data();for(const f in o)Object.assign(o[f],clone(x[f]||{}))});Object.assign(real,o);got.m=1;check()},err);
    store.sess.onSnapshot(q=>{const ss={};q.docs.forEach(d=>{ss[d.id]=clone(d.data())});real.sessions=ss;got.s=1;check()},err);

}

  const txt=String(raw==null?"":raw).replace(/[\s\u00a0\u202f]/g,"");let v=num(txt);
  const hm=txt.match(/^(\d+)h(?:(\d+)min)?/i);if(hm)v=+hm[1]+(+(hm[2]||0))/60;if(!isFinite(v))continue;
  if(H_SLEEP.includes(k))v=v>1440?v/3600:v>24?v/60:v;
  if(k==="spo2"&&v<=1)v*=100;
  if(k==="hrv"&&v>0&&v<1)v*=1000;
  if(k==="w_min"){const cm=txt.match(/^(\d+):(\d+)(?::(\d+))?$/);if(cm)v=cm[3]!=null?(+cm[1])*60+(+cm[2])+(+cm[3])/60:(+cm[1])+(+cm[2])/60}
  if(k==="w_min"&&v>300)v/=60;
  o[k]=v}
  if(o.sleep>12)["sleep","deep","rem","core","awake"].forEach(s=>{if(o[s]>0)o[s]/=2});
  return o}

      w.push({start:st,end:isFinite(en)?en:st+(x.w_min||0)*6e4,min:x.w_min||(isFinite(en)?(en-st)/6e4:null),kcal:x.w_kcal,hr:x.w_hr,hrmax:x.w_hrmax,type:x.w_type})});health.workouts=w}

function hBase(k,day,n){const v=[];for(let i=1;i<=(n||14);i++){const x=(health.daily[addDays(day,-i)]||{})[k];if(x>0)v.push(x)}return v.length>=3?mean(v):null}
function readiness(S,day){day=day||today();const h=health.daily[day]||{},ci=(S.checkins||{})[day]||{},parts=[];
  const bh=hBase("hrv",day),br=hBase("rhr",day);
  if(h.hrv>0&&bh)parts.push(["HRV",clamp(50+(h.hrv/bh-1)*250)]);
  if(h.rhr>0&&br)parts.push(["Vilopuls",clamp(50-(h.rhr/br-1)*500)]);
  if(h.sleep>0)parts.push(["Sömn",clamp((h.sleep-5)/3*100)]);
  if(ci.energy)parts.push(["Energi",(ci.energy-1)*25]);

  if(ci.sore){const v=Object.values(ci.sore);if(v.length)parts.push(["Träningsvärk",clamp(100-mean(v)*50)])}

  if(!parts.length)return null;const score=Math.round(mean(parts.map(p=>p[1])));
  return{score,parts,label:score>=70?"Kör tungt":score>=45?"Kör som vanligt":"Ta det lugnt",cls:score>=70?"up":score>=45?"flat":"down"}}

  const top=Math.max(...lf.sets.map(x=>x.kg)),atTop=lf.sets.filter(x=>x.kg===top),inc=top<20?1:2.5;
  const minR=Math.min(...atTop.map(x=>x.r)),maxR=Math.max(...lf.sets.map(x=>x.r)),rirs=atTop.map(x=>x.rir).filter(v=>v!=null),easy=rirs.length&&Math.min(...rirs)>=2;
  if(deloadOn(S))return{kg:roundKg(top*.8),r:hi,why:"Lätt vecka: 20 % lättare än vanligt"};
  const rd=readiness(S,today());

const EXP={lighter:{t:"Lättare, fler reps",d:s=>`Testa ${fmt(roundKg(s.kg*.9),2)} kg och sikta på ${s.r+3} reps per set.`},

  rest_long:{t:"Längre vila",d:()=>"Vila 3 minuter mellan seten idag och se om du orkar fler reps."},

function expFor(S,day,exs){const s=S.sessions[day]||{};if(s.exp)return s.exp;if(s.expNo)return null;
  const pd=prevSession(S,day);if(pd&&S.sessions[pd].exp&&S.sessions[pd].exp.acc)return null;
  const rd=readiness(S,today());if(rd&&rd.score<45)return null;
  const cands=exs.filter(e=>lastFor(S,e.id,day)&&!(s.skip||{})[e.id]&&!exSets(S,day,e.id).length);if(!cands.length)return null;
  const pl=plateaus(S).map(p=>p.e.id),pc=cands.filter(e=>pl.includes(e.id)),pool=pc.length?pc:cands;
  const h=hashStr(day+(s.prog||"")),types=Object.keys(EXP);return{ex:pool[h%pool.length].id,type:types[(h>>4)%types.length]}}
function plateaus(S){const out=[];usedEx(S).forEach(e=>{const s=exSeries(S,e.id);if(s.length<5)return;
  const prev=Math.max(...s.slice(0,-3).map(x=>x.e1)),rec=Math.max(...s.slice(-3).map(x=>x.e1));if(rec<=prev*1.005)out.push({e,since:s[s.length-3].d})});return out}

  const fe=sd.slice(-3).map(d=>+S.sessions[d].feel).filter(Boolean),en=[];for(let i=0;i<5;i++){const c=(S.checkins||{})[addDays(t,-i)];if(c&&c.energy)en.push(c.energy)}
  let down=0,tot=0;usedEx(S).forEach(e=>{const s=exSeries(S,e.id).filter(x=>daysBetween(x.d,t)<=21);if(s.length>=3){tot++;if(s[s.length-1].e1<s[0].e1)down++}});
  const tired=(fe.length>=2&&mean(fe)<=2.5)||(en.length>=3&&mean(en)<=2.3),weaker=tot>=2&&down/tot>.5;

function spark(vals,color){const v=vals.filter(x=>x!=null&&isFinite(x));if(v.length<2)return"";const mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn,n=v.length,W=100,H=30,c=color||"var(--ac)";

  if(sel===today()&&!demoOn){h+=renderReadiness(S)+renderCheckin(S)+renderMeasure(S)+renderWatchNudge();

  if(D.delsess){deleteSession(D.delsess);return}
  if(b.id==="logPast"){const v=$("#pastDate").value;if(!v||v>=today()){toast("Välj ett datum före idag.");return}

    wo={day:v,prog:pid,idx:firstOpenStep(real,v,pid)};render();window.scrollTo({top:0});return}
  if(b.id==="manEx"){manageEx=!manageEx;confirmDel=null;render();return}

    else{statFold.clear();statJust="f-*";saveFold();render()}return}
  if(D.so){const i=D.so.indexOf("|"),sid=D.so.slice(0,i),k=D.so.slice(i+1);

  if(b.id==="tmpOpen"){tmpAdd=!tmpAdd;render();setTimeout(()=>{const i=$("#tmpEx");if(i){i.focus();i.scrollIntoView({block:"center"})}},50);return}

  if(b.id==="guideT"){guideOpen=!guideOpen;render();return}
  if(D.copy){copyText(D.copy==="url"?INGEST():D.copy==="key"?SUPA.key:health.token||"");return}
  if(D.ci){const[k,v]=D.ci.split("|"),val=v==="y"?true:v==="n"?false:+v;ciDraft[k]=ciDraft[k]===val?undefined:val;if(ciDraft[k]===undefined)delete ciDraft[k];render();return}
  if(D.sore){const[m,v]=D.sore.split("|");ciDraft.sore=ciDraft.sore||{};ciDraft.sore[m]=ciDraft.sore[m]===+v?undefined:+v;if(ciDraft.sore[m]===undefined)delete ciDraft.sore[m];render();return}
  if(b.id==="ciSave"){if(!Object.keys(ciDraft).length){toast("Svara på minst en fråga, eller tryck Inte idag.");return}
    const pw=$("#ciPainWhere");if(pw)ciDraft.painWhere=pw.value.trim().slice(0,60);ensureReal();real.checkins[today()]=Object.assign({},ciDraft,{at:Date.now()});ciDraft={};saveMonth(today());toast("Tack! Svaren är sparade.");render();return}
  if(b.id==="ciSkip"){setMeta({ciSkip:today()});render();return}

    ensureReal();real.measures[today()]=o;saveMonth(today());measureOpen=false;toast("Måtten är sparade.");render();return}
  if(D.walk){const w=D.walk,mi=parseInt($("#wk-min").value,10),inc=num($("#wk-inc").value),spd=num($("#wk-spd").value);

    const s=clone(real.sessions[wo.day]||{sets:[]});s.walks=s.walks||{};s.walks[w]={min:mi,inc:Math.round(inc*10)/10,spd:Math.round(spd*10)/10,at:(s.walks[w]&&s.walks[w].at)||Date.now()};

      for(const k in drafts)if(k.startsWith(wo.day+"|"+ex+"|"))delete drafts[k]}real.sessions[wo.day]=s;saveSession(wo.day);render();return}
